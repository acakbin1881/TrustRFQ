<!-- TrustRFQ's mark. The geometry is OWNED BY src/brand/mark.tsx: the seal is a
     superellipse (n=5) rather than a rounded rect, and the glyph below is that
     module's GLYPH_MICRO, because a favicon is only ever read at 16-32px. These
     two path strings must stay byte-identical to SEAL and GLYPH_MICRO there.
     A static asset cannot reach the theme tokens, so the two colours are the
     literal values of --color-lime and --color-carbon from src/styles/theme.css. -->
